<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eleven</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --border-color: #ffffff;
        }

        .light-mode {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: #000000;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: monospace;
            margin: 0;
            padding: 20px 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            cursor: crosshair;
            transition: background-color 0.2s, color 0.2s;
        }

        .theme-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: 2px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 10px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            cursor: pointer;
            letter-spacing: 1px;
        }

        .theme-toggle:active {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: 3rem;
            margin-top: 1.2em;
            margin-bottom: 35px;
            text-align: center;
            width: 100%;
            letter-spacing: 3px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            flex-grow: 1;
            margin-bottom: 20px;
        }

        .rect {
            width: 100%;
            height: 55px;
            border: 2px solid var(--border-color);
            background-color: transparent;
            box-sizing: border-box;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.6rem;
            color: var(--text-color);
            letter-spacing: 2px;
            text-decoration: none;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        .rect:active {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
                margin-top: 1.5em;
                margin-bottom: 25px;
                letter-spacing: 2px;
            }

            .container {
                gap: 20px;
            }

            .rect {
                height: 55px;
                font-size: 1.4rem;
            }
        }

        .click-ripple {
            position: fixed;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-effect 0.6s linear;
            pointer-events: none;
            z-index: 9999;
        }

        @keyframes ripple-effect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()">Theme</button>

    <h1>Eleven</h1>
    
    <div class="container">
        <a href="projects/index.html" class="rect">Projects</a>
        <a href="about.html" class="rect">About</a>
        <a href="games.html" class="rect">Games</a>
        <a href="tools/index.html" class="rect">Online Tools</a>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        document.addEventListener('click', function (e) {
            if (e.target.classList.contains('theme-toggle')) return;

            const ripple = document.createElement('div');
            ripple.classList.add('click-ripple');
            document.body.appendChild(ripple);

            const size = 20;
            ripple.style.width = `${size}px`;
            ripple.style.height = `${size}px`;
            ripple.style.left = `${e.clientX - size / 2}px`;
            ripple.style.top = `${e.clientY - size / 2}px`;

            setTimeout(() => {
                ripple.remove();
            }, 600);
        });
    </script>

</body>
</html>
