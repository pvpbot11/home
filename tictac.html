<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe VS bot</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --bg-color: #000000;
            --border-color: #ffffff;
            --player-blue: #00008B;
            --player-red: #FF6666;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: monospace;
            margin: 0;
            padding: 20px 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            cursor: crosshair;
        }

        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: 2.2rem;
            margin-top: 1.5em;
            margin-bottom: 20px;
            text-align: center;
            width: 100%;
            letter-spacing: 2px;
        }

        #status {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.4rem;
            margin-bottom: 25px;
            letter-spacing: 1px;
            height: 30px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            margin-bottom: 25px;
        }

        .cell {
            border: 2px solid var(--border-color);
            background-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        .cell.blue::before, .cell.blue::after {
            content: '';
            position: absolute;
            width: 80%;
            height: 6px;
            background-color: var(--player-blue);
        }

        .cell.blue::before {
            transform: rotate(45deg);
        }

        .cell.blue::after {
            transform: rotate(-45deg);
        }

        .cell.red::before, .cell.red::after {
            content: '';
            position: absolute;
            width: 80%;
            height: 6px;
            background-color: var(--player-red);
        }

        .cell.red::before {
            transform: rotate(45deg);
        }

        .cell.red::after {
            transform: rotate(-45deg);
        }

        .restart-btn {
            background: transparent;
            border: 2px solid var(--border-color);
            color: #ffffff;
            padding: 10px 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            cursor: pointer;
            letter-spacing: 2px;
        }

        .restart-btn:active {
            background-color: #ffffff;
            color: #000000;
        }

        @media (max-width: 768px) {
            h1 { font-size: 1.6rem; }
            .board {
                grid-template-columns: repeat(3, 85px);
                grid-template-rows: repeat(3, 85px);
            }
        }

        .click-ripple {
            position: fixed;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-effect 0.6s linear;
            pointer-events: none;
            z-index: 9999;
        }

        @keyframes ripple-effect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <h1>Tic-Tac-Toe</h1>
    <div id="status"></div>

    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <button class="restart-btn" onclick="resetGame()">Restart</button>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playArcadeSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'square';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);

            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');
        const cells = document.querySelectorAll('.cell');
        
        let board = ['', '', '', '', '', '', '', '', ''];
        let isGameActive = true;
        let currentPlayer = 'blue';

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        function handleCellClick(e) {
            const clickedCell = e.target;
            const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

            if (board[clickedCellIndex] !== '' || !isGameActive || currentPlayer !== 'blue') {
                return;
            }

            makeMove(clickedCellIndex, 'blue');
            playArcadeSound();

            if (checkWin('blue')) {
                statusElement.textContent = '';
                isGameActive = false;
                return;
            }

            if (board.every(cell => cell !== '')) {
                statusElement.textContent = '';
                isGameActive = false;
                return;
            }

            currentPlayer = 'red';
            setTimeout(botMove, 400);
        }

        function makeMove(index, player) {
            board[index] = player;
            cells[index].classList.add(player);
        }

        function checkWin(player) {
            return winningConditions.some(condition => {
                return condition.every(index => board[index] === player);
            });
        }

        function botMove() {
            if (!isGameActive) return;

            let move = -1;

            if (Math.random() < 0.5) {
                move = findBestMove('red');
                if (move === -1) {
                    move = findBestMove('blue');
                }
            }

            if (move === -1) {
                const emptyCells = board.map((val, idx) => val === '' ? idx : null).filter(val => val !== null);
                if (emptyCells.length > 0) {
                    move = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                }
            }

            if (move !== -1) {
                makeMove(move, 'red');
                playArcadeSound();

                if (checkWin('red')) {
                    statusElement.textContent = '';
                    isGameActive = false;
                    return;
                }

                if (board.every(cell => cell !== '')) {
                    statusElement.textContent = '';
                    isGameActive = false;
                    return;
                }

                currentPlayer = 'blue';
            }
        }

        function findBestMove(player) {
            for (let condition of winningConditions) {
                const [a, b, c] = condition;
                let vals = [board[a], board[b], board[c]];
                if (vals.filter(v => v === player).length === 2 && vals.includes('')) {
                    if (board[a] === '') return a;
                    if (board[b] === '') return b;
                    if (board[c] === '') return c;
                }
            }
            return -1;
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            isGameActive = true;
            currentPlayer = 'blue';
            statusElement.textContent = '';
            cells.forEach(cell => {
                cell.className = 'cell';
            });
        }

        cells.forEach(cell => cell.addEventListener('click', handleCellClick));

        document.addEventListener('click', function (e) {
            if (e.target.classList.contains('cell') || e.target.classList.contains('restart-btn')) return;

            const ripple = document.createElement('div');
            ripple.classList.add('click-ripple');
            document.body.appendChild(ripple);

            const size = 20;
            ripple.style.width = `${size}px`;
            ripple.style.height = `${size}px`;
            ripple.style.left = `${e.clientX - size / 2}px`;
            ripple.style.top = `${e.clientY - size / 2}px`;

            setTimeout(() => {
                ripple.remove();
            }, 600);
        });
    </script>

</body>
</html>
