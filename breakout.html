<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --bg-color: #000000;
            --border-color: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: monospace;
            margin: 0;
            padding: 15px 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            cursor: crosshair;
            touch-action: none;
        }

        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.8rem;
            margin-top: 0.5em;
            margin-bottom: 15px;
            text-align: center;
            width: 100%;
            letter-spacing: 2px;
        }

        canvas {
            border: 2px solid var(--border-color);
            background-color: #000000;
            display: block;
            margin-bottom: 20px;
            max-width: 100%;
            height: auto;
        }

        .restart-btn {
            background: transparent;
            border: 2px solid var(--border-color);
            color: #ffffff;
            padding: 10px 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            cursor: pointer;
            letter-spacing: 2px;
        }

        .restart-btn:active {
            background-color: #ffffff;
            color: #000000;
        }

        .click-ripple {
            position: fixed;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-effect 0.6s linear;
            pointer-events: none;
            z-index: 9999;
        }

        @keyframes ripple-effect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <h1>Breakout</h1>
    
    <canvas id="gameCanvas" width="400" height="450"></canvas>

    <button class="restart-btn" onclick="resetGame()">Restart</button>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playArcadeSound(freq = 440, duration = 0.08) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const brickRowCount = 6;
        const brickColumnCount = 6;
        const brickWidth = 54;
        const brickHeight = 18;
        const brickPadding = 6;
        const brickOffsetTop = 30;
        const brickOffsetLeft = 20;

        const brickColors = [
            "#00008B",
            "#008000",
            "#FF0000",
            "#FFFF00",
            "#800080",
            "#FFA500"
        ];

        let bricks = [];
        for (let c = 0; c < brickColumnCount; c++) {
            bricks[c] = [];
            for (let r = 0; r < brickRowCount; r++) {
                bricks[c][r] = { x: 0, y: 0, status: 1, color: brickColors[r % brickColors.length] };
            }
        }

        let ballRadius = 6;
        let x = canvas.width / 2;
        let y = canvas.height - 50;
        let dx = 2.5;
        let dy = -2.5;

        let paddleHeight = 10;
        let paddleWidth = 80;
        let paddleX = (canvas.width - paddleWidth) / 2;

        let rightPressed = false;
        let leftPressed = false;

        document.addEventListener("keydown", keyDownHandler, false);
        document.addEventListener("keyup", keyUpHandler, false);
        canvas.addEventListener("mousemove", mouseMoveHandler, false);
        canvas.addEventListener("touchmove", touchMoveHandler, { passive: false });

        function keyDownHandler(e) {
            if (e.key === "Right" || e.key === "ArrowRight") {
                rightPressed = true;
            } else if (e.key === "Left" || e.key === "ArrowLeft") {
                leftPressed = true;
            }
        }

        function keyUpHandler(e) {
            if (e.key === "Right" || e.key === "ArrowRight") {
                rightPressed = false;
            } else if (e.key === "Left" || e.key === "ArrowLeft") {
                leftPressed = false;
            }
        }

        function mouseMoveHandler(e) {
            let rect = canvas.getBoundingClientRect();
            let scaleX = canvas.width / rect.width;
            let relativeX = (e.clientX - rect.left) * scaleX;
            if (relativeX > 0 && relativeX < canvas.width) {
                paddleX = relativeX - paddleWidth / 2;
            }
        }

        function touchMoveHandler(e) {
            e.preventDefault();
            let rect = canvas.getBoundingClientRect();
            let scaleX = canvas.width / rect.width;
            let relativeX = (e.touches[0].clientX - rect.left) * scaleX;
            if (relativeX > 0 && relativeX < canvas.width) {
                paddleX = relativeX - paddleWidth / 2;
            }
        }

        function collisionDetection() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    let b = bricks[c][r];
                    if (b.status === 1) {
                        if (x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
                            dy = -dy;
                            b.status = 0;
                            playArcadeSound(600, 0.05);
                        }
                    }
                }
            }
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.fill();
            ctx.closePath();
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddleX, canvas.height - paddleHeight - 10, paddleWidth, paddleHeight);
            ctx.fillStyle = "#ffffff";
            ctx.fill();
            ctx.closePath();
        }

        function drawBricks() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    if (bricks[c][r].status === 1) {
                        let brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
                        let brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;
                        ctx.beginPath();
                        ctx.rect(brickX, brickY, brickWidth, brickHeight);
                        ctx.fillStyle = bricks[c][r].color;
                        ctx.fill();
                        ctx.strokeStyle = "#ffffff";
                        ctx.lineWidth = 1;
                        ctx.stroke();
                        ctx.closePath();
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBricks();
            drawBall();
            drawPaddle();
            collisionDetection();

            if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
                dx = -dx;
                playArcadeSound(300, 0.03);
            }
            if (y + dy < ballRadius) {
                dy = -dy;
                playArcadeSound(300, 0.03);
            } else if (y + dy > canvas.height - ballRadius - 10) {
                if (x > paddleX && x < paddleX + paddleWidth) {
                    dy = -dy;
                    playArcadeSound(500, 0.04);
                } else if (y + dy > canvas.height) {
                    document.location.reload();
                }
            }

            if (rightPressed && paddleX < canvas.width - paddleWidth) {
                paddleX += 5;
            } else if (leftPressed && paddleX > 0) {
                paddleX -= 5;
            }

            x += dx;
            y += dy;
            requestAnimationFrame(draw);
        }

        function resetGame() {
            document.location.reload();
        }

        draw();

        document.addEventListener('click', function (e) {
            if (e.target.classList.contains('restart-btn') || e.target.tagName === 'CANVAS') return;

            const ripple = document.createElement('div');
            ripple.classList.add('click-ripple');
            document.body.appendChild(ripple);

            const size = 20;
            ripple.style.width = `${size}px`;
            ripple.style.height = `${size}px`;
            ripple.style.left = `${e.clientX - size / 2}px`;
            ripple.style.top = `${e.clientY - size / 2}px`;

            setTimeout(() => {
                ripple.remove();
            }, 600);
        });
    </script>

</body>
</html>
